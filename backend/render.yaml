services:
  - type: web
    name: portfolio-backend
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    region: singapore
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: ALLOWED_ORIGINS
        value: https://amudipurba.com,https://admin.amudipurba.com
      - key: CMS_URL
        value: https://admin.amudipurba.com
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_REDIRECT_URL
        sync: false
      - key: ADMIN_GITHUB_ID
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
